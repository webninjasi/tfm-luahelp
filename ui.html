<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TFM Lua Help - UI Editor</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans" crossorigin="anonymous">
    <link type="text/css" rel="stylesheet" href="assets/style.css">
    <link type="text/css" rel="stylesheet" href="assets/tfm.css">
  </head>
  <body>
    <div class="wrapper">
      <div class="header">
        <a href="./index.html"><button>Homepage</button></a>
        <button onclick="toggleGameUI()">Toggle Game UI</button>
        <button onclick="toggleCode()">Toggle Code</button>
        <button id="sidebar-toggle" type="button">Objects</button>
        <button onclick="editorAPI.zoom.by(1 / 1.25)" title="Zoom out">-</button>
        <button onclick="editorAPI.zoom.set(1); editorAPI.resetPan()" title="Reset zoom and pan" id="zoom-level">100%</button>
        <button onclick="editorAPI.zoom.by(1.25)" title="Zoom in">+</button>
        <button onclick="exportJSON()">Export JSON</button>
        <button onclick="document.getElementById('json_import_input').click()">Import JSON</button>
        <input type="file" id="json_import_input" accept=".json" style="display: none;" />
        <input type="file" id="image_upload" accept="image/*" multiple style="display: none;" />
        <span id="error"></span>
      </div>

      <div id="ui-wrapper" class="TFMBG">
        <div id="drop-overlay">
          <div class="drop-message">Drop image files here!</div>
        </div>

        <aside id="sidebar" class="ui-sidebar">
          <div class="ui-sidebar-header">
            <span>Objects</span>
            <button type="button" id="sidebar-close" title="Close sidebar">&times;</button>
          </div>
          <ul id="object-list" class="ui-object-list"></ul>
        </aside>

        <div id="scene"></div>
        <div id="inplace-overlay"></div>

        <div class="ui-editor-text">
          <textarea id="input" maxlength="2000"></textarea>
        </div>

        <div class="ui-editor-code">
          <textarea id="output" onclick="copyText(this)" readonly="readonly"></textarea>
        </div>
      </div>
    </div>

    <script src="assets/konva.min.js"></script>
    <script src="assets/renderhtml.js"></script>

    <script src="assets/editorapi.js"></script>
    <script src="assets/editor.js"></script>
  </body>
</html>
